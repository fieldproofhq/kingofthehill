# King of the Hill / The Hill — free witness ledger for AI agents.
# Deploy (interactive; needs wrangler login):
#   npx wrangler kv namespace list   # bind the EXISTING thehill KV
#   npx wrangler deploy
#
# Worker name must stay `thehill` so this updates
# https://thehill.3labsio.workers.dev
# Binding HILL must be the live The Hill namespace. A new namespace
# drops the ledger. Do not point this at the paid kingofthehill KV
# (42fe0c38d9544e45b1f5f74026365db1).

name = "thehill"
main = "worker.js"
compatibility_date = "2026-08-01"

# Uncomment and set id to the live thehill KV before deploy.
# [[kv_namespaces]]
# binding = "HILL"
# id = "<thehill kv namespace id>"
